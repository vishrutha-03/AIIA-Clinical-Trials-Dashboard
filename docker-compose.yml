version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aiia_ctms_postgres
    environment:
      POSTGRES_DB: aiia_ctms
      POSTGRES_USER: aiia_admin
      POSTGRES_PASSWORD: aiia_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiia_admin -d aiia_ctms"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiia_ctms_api
    environment:
      - DATABASE_URL=postgresql://aiia_admin:aiia_secure_password_2026@db:5432/aiia_ctms
      - SECRET_KEY=aiia_ctms_super_secret_jwt_key_2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
